name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --quiet pytest pyyaml

      - name: Run test suite
        run: |
          python -m pytest tests/ -q

      - name: Validate SKILL.md frontmatter parses
        run: |
          python3 - <<'EOF'
          import sys, glob, yaml
          # every skill must have a SKILL.md whose YAML frontmatter loads
          bad = []
          for path in glob.glob('skills/*/SKILL.md'):
              text = open(path, encoding='utf-8').read()
              if not text.startswith('---'):
                  bad.append(path); continue
              fm = text.split('---', 2)[1]
              try:
                  yaml.safe_load(fm)
              except Exception as e:
                  bad.append(f"{path}: {e}")
          if bad:
              print("INVALID FRONTMATTER:")
              print('\n'.join(bad))
              sys.exit(1)
          print(f"all {len(glob.glob('skills/*/SKILL.md'))} skills parse")
          EOF
